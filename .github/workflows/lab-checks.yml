name: lab-checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - name: Verify the packaged source inventory
        run: python verify_package.py
      - name: Test CI reporting and package verification helpers
        run: |
          python -m unittest discover -s examples/ci -v
          python -m unittest discover -s tools -v
      - name: Record the tested checkout and lab results
        run: python examples/ci/collect_lab_result.py --output ci-results
      - name: Save the result and log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-result-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
